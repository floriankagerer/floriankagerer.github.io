# Entries of the BED-BPP leaderboard (page: /leaderboard_new/).
#
# To add a submission, append one block to this list. Rank, podium, score bar and the task filter are
# built automatically: entries are sorted by `score` (highest first), equal scores share a rank.
# The order of the entries in this file does not matter.
#
#   - algorithm: name                       # required
#     url: https://...                      # optional, link of the algorithm
#     algorithm_note: "..."                 # optional, tooltip next to the algorithm name
#     task: Offline 3DBP                    # required, used for the label and the task filter
#     task_note: "..."                      # optional, tooltip on the task label
#     score: 0.724553                       # required, number between 0 and 1 (not quoted!)
#     submitter: F. Kagerer                 # required, who submitted the packing plan (shown as "Submitted by"),
#                                           # not necessarily the developer of the algorithm
#     date: 2022-12-05                      # required, YYYY-MM-DD
#     packing_plan: /assets/packing_plans/<file>.json   # optional, download link
#     plans_url: https://...                # optional, link to all visualized packing plans or a video
#     plans_label: "All plans (PDF)"        # optional, text of that link
#     images:                               # optional, thumbnails (click to enlarge)
#       - /assets/leaderboard_visualization/<name>/order_00100007.png

